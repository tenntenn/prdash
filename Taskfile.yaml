version: '3'

vars:
  MODULE: github.com/tenntenn/prdash

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Start the local prdash web dashboard
    cmds:
      - aqua exec -- go run {{.MODULE}} {{.CLI_ARGS}}

  mcp:
    desc: Start the prdash MCP server over stdio
    silent: true
    cmds:
      - aqua exec -- go run {{.MODULE}} -mcp {{.CLI_ARGS}}

  build:
    desc: Build the prdash binary
    cmds:
      - aqua exec -- go build -buildvcs=true -o '{{.ROOT_DIR}}/prdash-bin' {{.MODULE}}

  fmt:
    desc: Format Go source files with goimports via aqua
    cmds:
      - aqua exec -- goimports -local {{.MODULE}} -w '{{.ROOT_DIR}}'

  fix:
    desc: Apply go fix and format source files
    cmds:
      - aqua exec -- go fix {{.MODULE}}/...
      - task: fmt

  lint:
    desc: Run go vet static analysis
    cmds:
      - aqua exec -- go vet {{.MODULE}}/...

  test:
    desc: Format and run tests with race detector enabled
    cmds:
      - task: fmt
      - aqua exec -- go test -race {{.MODULE}}/...

  check:
    desc: Run fix, lint, and test sequentially
    cmds:
      - task: fix
      - task: lint
      - task: test

  repo:
    desc: Run git commands
    cmds:
      - git {{.CLI_ARGS}}

  gh:
    desc: Run GitHub CLI commands
    cmds:
      - gh {{.CLI_ARGS}}

  ui:browser:
    desc: Run agent-browser commands for UI inspection
    cmds:
      - agent-browser --session prdash-check {{.CLI_ARGS}}

  ui:docs:
    desc: Capture documentation screenshots using synthetic repository data
    cmds:
      - task: build
      - mkdir -p '{{.ROOT_DIR}}/docs/screenshots'
      - >-
        bash -c '
          export XDG_RUNTIME_DIR=/tmp/prdash-browser-runtime
          export AGENT_BROWSER_ARGS="--no-sandbox"
          mkdir -p "$XDG_RUNTIME_DIR"
          "{{.ROOT_DIR}}/prdash-bin" -addr 127.0.0.1:18765 -repo acme/nebula-api > /tmp/prdash-docs.log 2>&1 &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true; agent-browser --session prdash-docs close 2>/dev/null || true" EXIT
          for i in $(seq 1 50); do
            if grep -q "prdash listening" /tmp/prdash-docs.log; then break; fi
            sleep 0.1
          done
          agent-browser --session prdash-docs open http://127.0.0.1:18765
          agent-browser --session prdash-docs set viewport 1440 920
          agent-browser --session prdash-docs eval "new Promise(r => setTimeout(r, 400))"
          agent-browser --session prdash-docs screenshot "{{.ROOT_DIR}}/docs/screenshots/dashboard-overview.png"
          agent-browser --session prdash-docs eval "document.querySelector(\"[data-pr-details=\\\"101\\\"] summary\").click(); document.querySelector(\"[data-pr-details=\\\"102\\\"] summary\").click();"
          agent-browser --session prdash-docs eval "new Promise(r => setTimeout(r, 300))"
          agent-browser --session prdash-docs screenshot "{{.ROOT_DIR}}/docs/screenshots/pr-detail-expanded.png"
        '

  ui:check:
    desc: Verify the web dashboard UI in a headless browser
    requires:
      vars: [URL]
    cmds:
      - agent-browser --session prdash-check open '{{.URL}}'
      - >-
        agent-browser --session prdash-check eval '
        (async () => {
          const wait = async (fn) => {
            for (let i = 0; i < 150; i++) {
              if (fn()) return;
              await new Promise((r) => setTimeout(r, 40));
            }
            throw new Error("timeout");
          };
          await wait(() => document.querySelectorAll("[data-pr-card]").length === 9);
          if (document.querySelectorAll(".pr-details[open]").length !== 0) {
            throw new Error("PR details must be collapsed by default");
          }
          const stack = document.querySelector("[data-stack-group=\"stack-oauth\"]");
          if (!stack || !stack.textContent.includes("#101 → #102 → #103")) {
            throw new Error("3-tier stack chain not rendered");
          }
          const pr107Details = document.querySelector("[data-pr-details=\"107\"]");
          pr107Details.querySelector("summary").click();
          await wait(() => pr107Details.open);
          pr107Details.querySelector("[data-routine=\"107\"][data-action=\"resolve_conflicts\"]").click();
          await wait(() => document.querySelector("[data-pr-status-badge=\"107\"]").textContent.includes("Waiting for Human"));
          const ctrlInput = document.querySelector("#controller-input");
          ctrlInput.value = "Summarize stack progress";
          document.querySelector("#controller-form").requestSubmit();
          await wait(() => document.querySelector("#controller-messages").textContent.includes("Summarize stack progress"));
          if (document.documentElement.scrollWidth > window.innerWidth) {
            throw new Error("horizontal overflow detected");
          }
          return "PASS: default collapsed, 3-tier stack, routine action transition, notification, controller session";
        })()'
      - agent-browser --session prdash-check close
